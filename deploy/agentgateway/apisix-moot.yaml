# moot 路由片段（由 agentmoot/deploy/agentgateway/apply.py 注入到 agentgateway
# 的 runtime/<env>/apisix.yaml；该目录被 gitignore，属实际部署物，不进 agentgateway 源码）。
# 占位符由 apply.py 用部署期密钥替换。
  - id: agw-svc-moot
    priority: 100
    uris: ["/svc/moot", "/svc/moot/*"]
    plugins:
      openid-connect:
        client_id: apisix-moot
        client_secret: "__MOOT_CLIENT_SECRET__"
        discovery: https://auth.localtest.me:18443/realms/platform/.well-known/openid-configuration
        redirect_uri: https://app.localtest.me:18443/svc/moot/oauth2/callback
        ssl_verify: false
        bearer_only: true
        unauth_action: deny
        use_jwks: true
        token_signing_alg_values_expected: RS256
        set_access_token_header: true
        set_id_token_header: false
        set_userinfo_header: true
        realm: platform
        claim_validator:
          audience:
            required: true
            match_with_client_id: true
      proxy-rewrite:
        regex_uri: ["^/svc/moot(.*)", "$1"]
      serverless-post-function:
        phase: before_proxy
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local cjson = require("cjson.safe")
              local hmac = require("resty.hmac")
              local to_hex = require("resty.string").to_hex
              -- X-Userinfo 只对人类 token 可用；client_credentials 的 userinfo 会 403。
              -- 因此优先 userinfo，缺失时退回解析 APISIX 已验签的 X-Access-Token payload。
              local function decode_json(b64)
                if not b64 or b64 == "" then return nil end
                local s = b64:gsub("-", "+"):gsub("_", "/")
                local rem = #s % 4
                if rem == 2 then s = s .. "==" elseif rem == 3 then s = s .. "=" end
                local raw = ngx.decode_base64(s)
                if not raw then return nil end
                local ok, obj = pcall(cjson.decode, raw)
                if ok and type(obj) == "table" then return obj end
                return nil
              end

              local info = decode_json(ngx.var.http_x_userinfo)
              if not info then
                local tok = ngx.var.http_x_access_token or ""
                local payload_b64 = tok:match("^[^%.]+%.([^%.]+)%.")
                info = decode_json(payload_b64)
              end
              if not info then
                core.log.error("moot: no identity claims (userinfo/access token missing)")
                return 401, "no identity claims"
              end

              local sub = info.sub or ""
              local principal = info.principal_id or sub
              if sub == "" or principal == "" then
                core.log.error("moot: missing sub/principal_id")
                return 401, "missing identity claims"
              end
              local owner = info.owner_id or ""
              local request_id = ngx.var.request_id or ""
              local exp = ngx.time() + 60
              local payload = "moot|" .. sub .. "|" .. principal .. "|" ..
                              request_id .. "|" .. tostring(exp)
              local secret = "__AGW_PROOF_SECRET_MOOT__"
              if not secret or secret == "" then
                core.log.error("moot: AGW_PROOF_SECRET_MOOT is not configured")
                return 500, "gateway proof secret missing"
              end
              local mac = hmac:new(secret, hmac.ALGOS.SHA256)
              if not mac then return 500, "hmac init failed" end
              mac:update(payload)
              local proof = "v1." .. tostring(exp) .. "." .. to_hex(mac:final())

              ngx.req.set_header("X-Principal-Id", principal)
              ngx.req.set_header("X-AGW-App", "moot")
              ngx.req.set_header("X-AGW-Request-Id", request_id)
              ngx.req.set_header("X-AGW-Proof", proof)
              if owner ~= "" then
                ngx.req.set_header("X-Owner-Id", owner)
              end
            end
    upstream:
      type: roundrobin
      scheme: http
      pass_host: node
      nodes:
        "host.containers.internal:30001": 1

  - id: agw-root
    priority: 0
    uri: /
    upstream:
      type: roundrobin
      scheme: http
      pass_host: node
      nodes:
        "agw-demo:8080": 1
