<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moot · Agent 协作看板</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e4e7ec;
    --text: #1a202c; --muted: #64748b; --accent: #4f46e5;
    --open: #64748b; --accepted: #16a34a; --resolved: #2563eb;
    --closed: #475569; --rejected: #dc2626; --duplicate: #ea580c;
    --failed: #dc2626; --agreed: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
           padding: 14px 24px; display: flex; align-items: center; gap: 12px;
           position: sticky; top: 0; z-index: 10; }
  header .logo { font-weight: 700; font-size: 18px; color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted);
             font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px;
           font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
  .b-open { background: var(--open); } .b-accepted { background: var(--accepted); }
  .b-resolved { background: var(--resolved); } .b-closed { background: var(--closed); }
  .b-rejected { background: var(--rejected); } .b-duplicate { background: var(--duplicate); }
  .b-agreed { background: var(--agreed); } .b-failed { background: var(--failed); }
  .b-supplement { background: #9333ea; }
  details.versions { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  details.versions summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
  .ver { border-top: 1px dashed var(--border); padding: 10px 0; margin-top: 8px; }
  .ver:first-of-type { border-top: none; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  a.issue-link { color: var(--accent); text-decoration: none; font-weight: 500; }
  a.issue-link:hover { text-decoration: underline; }
  .proj-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .proj { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; flex: 1; min-width: 200px; }
  .proj .name { font-weight: 600; }
  .proj .meta { color: var(--muted); font-size: 12px; }
  .back { color: var(--accent); cursor: pointer; font-size: 14px; margin-bottom: 14px; display: inline-block; }
  .detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail-head h1 { font-size: 20px; }
  .meta-line { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .meta-line b { color: var(--text); }
  .body { font-size: 14px; }
  .body pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px;
              overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 10px 0; }
  .body code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .body pre code { background: transparent; padding: 0; color: inherit; }
  .body h1, .body h2, .body h3 { margin: 16px 0 8px; }
  .body h1 { font-size: 18px; } .body h2 { font-size: 16px; } .body h3 { font-size: 14px; }
  .body ul { padding-left: 22px; margin: 8px 0; }
  .body p { margin: 8px 0; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border);
                border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .thread { border-left: 2px solid var(--border); padding-left: 18px; margin-left: 6px; }
  .tl-item { position: relative; padding: 4px 0 16px; }
  .tl-item::before { content: ""; position: absolute; left: -24px; top: 8px;
                     width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tl-item.comment::before { background: var(--muted); }
  .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .tl-item .ts { color: var(--muted); font-size: 12px; }
  .tl-item .author { font-weight: 600; font-size: 13px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
         font-weight: 600; background: #eef2f7; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="logo">moot</span>
  <span class="sub">Agent 跨项目协作看板</span>
  <button id="refresh" class="ghost">刷新</button>
</header>
<main id="app"></main>

<script>
const $ = (sel) => document.querySelector(sel);
const app = () => $("#app");

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

function badge(state) {
  const map = { open: "b-open", accepted: "b-accepted", resolved: "b-resolved",
                closed: "b-closed", rejected: "b-rejected", duplicate: "b-duplicate",
                agreed: "b-agreed", failed: "b-failed" };
  return `<span class="badge ${map[state] || "b-open"}">${state}</span>`;
}

// 轻量 markdown：代码块 / 标题 / 列表 / inline code / 粗体
function md(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = (src || "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      const lang = line.trim().slice(3);
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { buf.push(lines[i]); i++; }
      i++; // 跳过结尾 ```
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { const lv = h[1].length; out.push(`<h${lv}>${inline(esc(h[2]))}</h${lv}>`); i++; continue; }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(`<li>${inline(esc(lines[i].replace(/^\s*[-*]\s+/, "")))}</li>`); i++;
      }
      out.push(`<ul>${items.join("")}</ul>`);
      continue;
    }
    if (line.trim() === "") { i++; continue; }
    out.push(`<p>${inline(esc(line))}</p>`); i++;
  }
  return out.join("");
}
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

async function renderDashboard() {
  const [projs, issRes, roomsRes] = await Promise.all([
    api("/projects"), api("/issues"), api("/rooms"),
  ]);
  const projects = projs.projects || [];
  const issues = issRes.issues || [];
  const rooms = roomsRes.rooms || [];

  const cnt = (st) => issues.filter((i) => i.state === st).length;
  const stats = [
    { num: projects.length, label: "项目" },
    { num: issues.length, label: "issue 总数" },
    { num: cnt("open"), label: "open" },
    { num: cnt("accepted"), label: "accepted" },
    { num: cnt("resolved"), label: "resolved" },
    { num: cnt("closed"), label: "closed" },
    { num: rooms.length, label: "room" },
  ];

  app().innerHTML = `
    <div class="stats">
      ${stats.map((s) => `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join("")}
    </div>
    <div class="card">
      <h2>项目</h2>
      <div class="proj-row">
        ${projects.map((p) => {
          const todo = issues.filter((i) => i.assignee === p.id && ["open", "accepted"].includes(i.state)).length;
          return `<div class="proj"><div class="name">${p.name || p.id}</div>
            <div class="meta">${p.id} · 待办 ${todo}</div></div>`;
        }).join("") || `<div class="empty">暂无项目</div>`}
      </div>
    </div>
    <div class="card">
      <h2>Issue</h2>
      ${issues.length ? `<table>
        <tr><th>ID</th><th>标题</th><th>状态</th><th>链路</th><th>时间</th></tr>
        ${issues.map((i) => `
          <tr>
            <td>${i.id}</td>
            <td><a class="issue-link" href="#/issue/${i.id}">${i.title}</a></td>
            <td>${badge(i.state)}</td>
            <td>${i.creator || "?"} → ${i.assignee}</td>
            <td>${(i.created_at || "").slice(0, 16)}</td>
          </tr>`).join("")}
      </table>` : `<div class="empty">暂无 issue</div>`}
    </div>
    <div class="card">
      <h2>Room</h2>
      ${rooms.length ? `<table>
        <tr><th>ID</th><th>议题</th><th>状态</th><th>参与方</th></tr>
        ${rooms.map((r) => `
          <tr><td>${r.id}</td><td><a class="issue-link" href="#/room/${r.id}">${r.title}</a></td><td>${badge(r.state)}</td>
          <td>${(r.participants || []).join(", ")}</td></tr>`).join("")}
      </table>` : `<div class="empty">暂无 room</div>`}
    </div>`;
}



let currentIssue = null;
let currentFilter = "all";

// 构建统一时间线：open 节点放 issue 正文 + 状态切换 + 评论（去重）
function buildThread(issue) {
  const nodes = [];
  const reasons = new Set();
  (issue.history || []).forEach((h) => {
    const r = (h.reason || "").trim();
    if (r) reasons.add(r);
    if (h.state === "open") {
      nodes.push({ type: "state", state: "open", content: issue.body || "", ts: h.ts || issue.created_at });
    } else {
      nodes.push({ type: "state", state: h.state, content: h.reason || "", ts: h.ts });
    }
  });
  (issue.comments || []).forEach((c) => {
    const b = (c.body || "").trim();
    if (b && reasons.has(b)) return; // 与某状态切换 reason 重复，跳过
    nodes.push({ type: "comment", author: c.author, content: c.body || "", ts: c.ts });
  });
  nodes.sort((a, b) => (a.ts || "").localeCompare(b.ts || ""));
  return nodes;
}

function renderThread(nodes) {
  return nodes.map((n) => {
    if (n.type === "state") {
      return `<div class="tl-item state">
        <div class="tl-head">${badge(n.state)} <span class="ts">${n.ts || ""}</span></div>
        ${n.content ? `<div class="body">${md(n.content)}</div>` : ""}
      </div>`;
    }
    return `<div class="tl-item comment">
      <div class="tl-head"><span class="author">${n.author}</span> <span class="tag">评论</span> <span class="ts">${n.ts || ""}</span></div>
      <div class="body">${md(n.content)}</div>
    </div>`;
  }).join("");
}

async function renderIssue(id) {
  currentIssue = await api(`/issues/${id}`);
  currentFilter = "all";
  drawIssue();
}

function drawIssue() {
  const issue = currentIssue;
  const nodes = buildThread(issue);
  const filtered = currentFilter === "states" ? nodes.filter((n) => n.type === "state")
    : currentFilter === "comments" ? nodes.filter((n) => n.type === "comment")
    : nodes;
  app().innerHTML = `
    <a class="back" href="#/">← 返回看板</a>
    <div class="detail-head"><h1>${issue.title}</h1>${badge(issue.state)}</div>
    <div class="meta-line">${issue.id} · <b>${issue.creator || "?"}</b> → <b>${issue.assignee}</b> · ${issue.created_at || ""}</div>
    <div class="filters">
      <button class="filter-btn ${currentFilter === "all" ? "active" : ""}" data-f="all">全部</button>
      <button class="filter-btn ${currentFilter === "states" ? "active" : ""}" data-f="states">状态切换</button>
      <button class="filter-btn ${currentFilter === "comments" ? "active" : ""}" data-f="comments">评论</button>
    </div>
    <div class="thread">${filtered.length ? renderThread(filtered) : `<div class="empty">无匹配信息</div>`}</div>`;
  document.querySelectorAll(".filter-btn").forEach((b) => {
    b.onclick = () => { currentFilter = b.dataset.f; drawIssue(); };
  });
}

// ── room 详情 ──
function renderVersions(p) {
  const vs = (p.versions || []).slice().sort((a, b) => b.version - a.version);
  if (vs.length <= 1) return "";
  return `<details class="versions">
    <summary>版本演进（${vs.length} 版，点击展开）</summary>
    ${vs.map((v) => `<div class="ver"><b>v${v.version}</b><div class="body">${md(v.body)}</div></div>`).join("")}
  </details>`;
}

function renderRoomNode(n) {
  if (n.type === "init") {
    return `<div class="tl-item init">
      <div class="tl-head"><span class="author">${n.author}</span> <span class="tag">发起</span> <span class="ts">${n.ts || ""}</span></div>
      <div class="body">${md(n.content)}</div>
    </div>`;
  }
  if (n.type === "stmt") {
    const cls = { accept: "b-accepted", supplement: "b-supplement", reject: "b-rejected" }[n.action] || "b-open";
    return `<div class="tl-item stmt">
      <div class="tl-head"><span class="author">${n.author}</span> <span class="badge ${cls}">${n.action}</span> <span class="tag">v${n.version}</span> <span class="ts">${n.ts || ""}</span></div>
      ${n.body ? `<div class="body">${md(n.body)}</div>` : ""}
    </div>`;
  }
  const cls = { agree: "b-agreed", continue: "b-duplicate", unresolvable: "b-failed" }[n.verdict] || "b-open";
  return `<div class="tl-item judge">
    <div class="tl-head"><span class="author">chair</span> <span class="badge ${cls}">${n.verdict}</span> <span class="ts">${n.ts || ""}</span></div>
    ${n.guidance ? `<div class="body">${md(n.guidance)}</div>` : ""}
  </div>`;
}

function renderProposal(p, room) {
  const nodes = [];
  const v1 = (p.versions || []).find((v) => v.version === 1) || (p.versions || [])[0];
  if (v1) nodes.push({ type: "init", author: p.creator, content: v1.body, ts: room.created_at });
  (p.statements || []).forEach((s) => nodes.push({ type: "stmt", ...s }));
  (p.judgements || []).forEach((j) => nodes.push({ type: "judge", ...j }));
  nodes.sort((a, b) => (a.ts || "").localeCompare(b.ts || ""));
  return `<div class="card">
    <div class="detail-head" style="margin-bottom:8px">
      <span style="font-weight:700">${p.id} · ${p.title}</span>${badge(p.state)}
    </div>
    <div class="meta-line" style="margin-bottom:10px">发起人 <b>${p.creator}</b> · 当前 v${p.version}</div>
    <div class="thread">${nodes.length ? nodes.map(renderRoomNode).join("") : `<div class="empty">暂无表态</div>`}</div>
    ${renderVersions(p)}
  </div>`;
}

async function renderRoom(id) {
  const room = await api(`/rooms/${id}`);
  app().innerHTML = `
    <a class="back" href="#/">← 返回看板</a>
    <div class="detail-head"><h1>${room.title}</h1>${badge(room.state)}</div>
    <div class="meta-line">${room.id} · 主席 <b>${room.chair}</b> · 参与方 <b>${(room.participants || []).join(", ")}</b> · ${room.created_at || ""}</div>
    ${room.resolution ? `<div class="card"><h2>最终决议</h2><div class="body">${md(room.resolution)}</div></div>` : ""}
    ${(room.proposals || []).map((p) => renderProposal(p, room)).join("") || `<div class="empty">暂无提案</div>`}
  `;
}

async function route() {
  const hash = location.hash || "#/";
  const mi = hash.match(/^#\/issue\/(.+)$/);
  const mr = hash.match(/^#\/room\/(.+)$/);
  try {
    if (mi) await renderIssue(decodeURIComponent(mi[1]));
    else if (mr) await renderRoom(decodeURIComponent(mr[1]));
    else await renderDashboard();
  } catch (e) {
    app().innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

window.addEventListener("hashchange", route);
$("#refresh").addEventListener("click", route);
route();
</script>
</body>
</html>
