# 发布到 GitHub Packages（npm registry）
#
# 触发：
#   1) 打 tag `v0.1.0` → 自动发布（tag 必须等于 package.json 的 version）
#   2) 手动 Run workflow → 默认 dry_run=true，只组装打包、不发布
#
# 权限：packages: write（用仓库自带的 GITHUB_TOKEN，无需额外 secret）。

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只组装打包、不发布"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@heifengyinshi2-eng"

      - name: 校验 tag 与 package.json version 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=$VER"
          [ "$TAG" = "$VER" ] || { echo "✗ tag($TAG) != version($VER)"; exit 1; }

      - name: 组装发布目录（白名单）
        run: node scripts/release/pack.mjs

      - name: 展示将发布的内容
        run: |
          find dist-release -type f | sort
          node -p "JSON.stringify(require('./dist-release/package.json'), null, 2)"

      - name: 发布
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: dist-release
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
